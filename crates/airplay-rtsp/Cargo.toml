[package]
name = "airplay-rtsp"
version = "0.1.0"
edition = "2021"

[dependencies]
airplay-core = { path = "../airplay-core" }
airplay-crypto = { path = "../airplay-crypto" }
airplay-stream = { path = "../airplay-stream" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
thiserror = "2"
tracing = "0.1"
sha2 = "0.11"
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync", "io-util"] }
num-bigint = "0.5"
chacha20poly1305 = "0.11"
