[workspace]
resolver = "2"
members = [
    "crates/airplay-core",
    "crates/airplay-crypto",
    "crates/airplay-rtsp",
    "crates/audio-pipe",
    "crates/app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
num-bigint = "0.5"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell_PropertiesSystem",
] }
