[package]
name = "airplay-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
airplay-core = { path = "../airplay-core" }
airplay-crypto = { path = "../airplay-crypto" }
chacha20poly1305 = "0.11"
tokio = { version = "1", features = ["net", "time", "sync"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
